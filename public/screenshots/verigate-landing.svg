<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="vgLandTitle vgLandDesc">
  <title id="vgLandTitle">VeriGate landing</title>
  <desc id="vgLandDesc">Product entry  verification as a release gate from evidence to report.</desc>
  <rect width="960" height="540" fill="#07060a"/>
  <text x="48" y="52" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">VERIGATE · LANDING</text>
  <text x="48" y="140" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36">Every test tells a story.</text>
  <text x="48" y="186" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Make yours undeniable.</text>
  <g fill="none" stroke="rgba(181,124,255,0.45)" stroke-width="1">
    <rect x="48" y="240" width="200" height="56"/>
    <rect x="268" y="240" width="200" height="56"/>
    <rect x="488" y="240" width="200" height="56"/>
  </g>
  <g fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <text x="68" y="274">Tests</text>
    <text x="288" y="274">Evidence</text>
    <text x="508" y="274">Release</text>
  </g>
  <text x="48" y="360" fill="#8d8b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">One workspace from test evidence to GitHub PR verification</text>
  <text x="48" y="386" fill="#8d8b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">and an audit-ready report.</text>
  <text x="48" y="500" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="11">HMAC · commit status · PDF / JSON export</text>
</svg>
