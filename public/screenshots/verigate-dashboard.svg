<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="vgDashTitle vgDashDesc">
  <title id="vgDashTitle">VeriGate dashboard</title>
  <desc id="vgDashDesc">Verification dashboard showing runs, evidence, and release posture as a single workspace.</desc>
  <rect width="960" height="540" fill="#07060a"/>
  <text x="48" y="52" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">VERIGATE · DASHBOARD</text>
  <g fill="none" stroke="rgba(236,233,225,0.22)" stroke-width="1">
    <rect x="48" y="92" width="864" height="72"/>
    <rect x="48" y="188" width="270" height="280"/>
    <rect x="338" y="188" width="270" height="280"/>
    <rect x="628" y="188" width="284" height="280"/>
  </g>
  <text x="68" y="136" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">Verification command centre</text>
  <text x="520" y="136" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12">RUNS · EVIDENCE · RELEASE</text>
  <g fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">
    <text x="72" y="228">Runs</text>
    <text x="362" y="228">Evidence</text>
    <text x="652" y="228">Release posture</text>
  </g>
  <g fill="#8d8b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="72" y="268">Pytest / Playwright</text>
    <text x="72" y="294">Collected per run</text>
    <text x="362" y="268">Traces bound to a run</text>
    <text x="362" y="294">Failure diagnostics</text>
    <text x="652" y="268">PR checks + HMAC</text>
    <text x="652" y="294">Commit status</text>
    <text x="652" y="320">Export PDF / JSON</text>
  </g>
  <text x="48" y="508" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="11">Quantitative production metrics are not published yet.</text>
</svg>
