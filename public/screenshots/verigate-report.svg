<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="vgRepTitle vgRepDesc">
  <title id="vgRepTitle">VeriGate report</title>
  <desc id="vgRepDesc">Audit-ready export in PDF and JSON from the verification workspace.</desc>
  <rect width="960" height="540" fill="#07060a"/>
  <text x="48" y="52" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">VERIGATE · REPORT</text>
  <rect x="120" y="90" width="320" height="400" fill="none" stroke="rgba(236,233,225,0.28)"/>
  <rect x="520" y="90" width="320" height="400" fill="none" stroke="rgba(236,233,225,0.28)"/>
  <text x="148" y="140" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">PDF</text>
  <text x="548" y="140" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">JSON</text>
  <g fill="#8d8b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <text x="148" y="190">Run identity</text>
    <text x="148" y="218">Evidence index</text>
    <text x="148" y="246">PR / HMAC checks</text>
    <text x="148" y="274">Diagnostics summary</text>
    <text x="548" y="190">run_id</text>
    <text x="548" y="218">evidence[]</text>
    <text x="548" y="246">github.pr</text>
    <text x="548" y="274">diagnostics</text>
  </g>
  <text x="148" y="450" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="11">EXPORTABLE · AUDIT-READY</text>
  <text x="548" y="450" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="11">MACHINE-READABLE</text>
</svg>
