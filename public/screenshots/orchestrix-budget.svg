<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="oxBudTitle oxBudDesc">
  <title id="oxBudTitle">Orchestrix budget race</title>
  <desc id="oxBudDesc">Atomic budget reservation: 10 simultaneous requests, 1 admitted, 9 rejected, zero oversubscription.</desc>
  <rect width="960" height="540" fill="#0b0a1a"/>
  <text x="48" y="52" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">ORCHESTRIX · BUDGET</text>
  <text x="48" y="120" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">PostgreSQL conditional UPDATE</text>
  <text x="48" y="152" fill="#8d8b86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Admission is serialized in the database, not in application memory.</text>
  <g>
    <rect x="48" y="220" width="72" height="88" fill="rgba(61,220,132,0.35)" stroke="#3ddc84"/>
    <rect x="132" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="216" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="300" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="384" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="468" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="552" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="636" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="720" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
    <rect x="804" y="220" width="72" height="88" fill="rgba(255,122,89,0.28)" stroke="#ff7a59"/>
  </g>
  <text x="62" y="272" fill="#ece9e1" font-family="ui-monospace, monospace" font-size="12">OK</text>
  <text x="48" y="380" fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">10 simultaneous requests</text>
  <text x="48" y="414" fill="#3ddc84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">1 admitted</text>
  <text x="220" y="414" fill="#ff7a59" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">9 rejected</text>
  <text x="48" y="500" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12">ZERO OVERSUBSCRIPTION</text>
</svg>
