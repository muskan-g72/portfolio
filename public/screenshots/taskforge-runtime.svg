<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="tfTitle tfDesc">
  <title id="tfTitle">TaskForge runtime</title>
  <desc id="tfDesc">Submit flows into a bounded queue, then a fixed-size thread pool, with retry and dead-letter paths.</desc>
  <rect width="960" height="540" fill="#0a0a0c"/>
  <text x="48" y="56" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">TASKFORGE · RUNTIME</text>
  <g fill="none" stroke="rgba(236,233,225,0.28)" stroke-width="1">
    <rect x="60" y="140" width="160" height="64"/>
    <rect x="300" y="140" width="180" height="64"/>
    <rect x="560" y="140" width="180" height="64"/>
    <rect x="300" y="320" width="180" height="64"/>
    <rect x="560" y="320" width="180" height="64"/>
    <path d="M220 172 H300"/>
    <path d="M480 172 H560"/>
    <path d="M650 204 V320"/>
    <path d="M390 204 V320"/>
    <path d="M300 352 H220 V172"/>
  </g>
  <g fill="#ece9e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <text x="80" y="178">Submit</text>
    <text x="322" y="178">Bounded queue</text>
    <text x="590" y="178">Thread pool</text>
    <text x="322" y="358">Retry / timeout</text>
    <text x="590" y="358">Dead-letter</text>
  </g>
  <text x="48" y="500" fill="#8d8b86" font-family="ui-monospace, monospace" font-size="11">Backpressure when the queue is full. Drain on shutdown.</text>
</svg>
